name: Phase 1 and 2 quality gates
on:
  pull_request:
    branches: [main, phase0/foundation, phase1/saas-foundation, phase2/repository-intelligence, phase2/eval-entry, phase2/ai-audited-pilot, phase2/canonical-fact-remediation, phase2/source-fact-v2-evaluation, phase2/pilot-control-plane-safety, phase2/retention-runtime-verification, phase2/aws-retention-integration, experiment/offline-source-to-video]
  push:
    branches: [phase1/saas-foundation, phase2/repository-intelligence, phase2/eval-entry, phase2/ai-audited-pilot, phase2/canonical-fact-remediation, phase2/source-fact-v2-evaluation, phase2/pilot-control-plane-safety, phase2/retention-runtime-verification, phase2/aws-retention-integration]
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Refresh system trust from signed Ubuntu sources (USN-8944-1)
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          APT_SOURCE=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCE[@]}" update
          sudo apt-get "${APT_SOURCE[@]}" install --yes --only-upgrade ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
      - name: Install controlled tooling and locked dependencies
        run: |
          python tools/security_bootstrap.py --repair-ensurepip
          python tools/security_trust.py --uv --seed
          uv sync --frozen
          uv run python tools/security_trust.py --certifi --seed
          uv run pip-audit --path "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
      - name: Verify locked runtime profile without development dependencies
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/repovox-runtime uv sync --frozen --no-dev
          /tmp/repovox-runtime/bin/python tools/security_trust.py --certifi --seed
          uv run pip-audit --path /tmp/repovox-runtime/lib/python3.12/site-packages
      - name: Security tooling checks
        run: |
          uv run ruff check tools/security_*.py
          uv run ruff format --check tools/security_*.py
          uv run mypy --strict tools/security_bootstrap.py tools/security_trust.py
      - run: uv run ruff check apps/api tests tools/phase1*.py tools/phase2*.py
      - run: uv run ruff format --check apps/api tests tools/phase1*.py tools/phase2*.py
      - run: uv run mypy
      - name: Additional AWS script body type checks (existing strict application gate unchanged)
        run: uv run mypy --explicit-package-bases --follow-imports silent --ignore-missing-imports --allow-untyped-defs --allow-untyped-calls --allow-any-generics --check-untyped-defs tools/phase2_aws*.py
      - run: uv run pytest tests/unit -q
      - name: Disabled AWS package drift, budget and CloudFormation validation (no credentials)
        run: |
          PYTHONPATH=. uv run python tools/phase2_aws_infrastructure.py --check
          PYTHONPATH=. uv run python tools/phase2_aws_budget.py
          python -m venv --without-pip /tmp/repovox-cfn-lint
          /tmp/repovox-cfn-lint/bin/python tools/security_bootstrap.py --pip-only
          /tmp/repovox-cfn-lint/bin/python -I -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r tools/requirements-cfn-lint.txt
          /tmp/repovox-cfn-lint/bin/python tools/security_trust.py --seed
          /tmp/repovox-cfn-lint/bin/cfn-lint --template infra/aws-retention/*.template.json
          uv run pip-audit --path /tmp/repovox-cfn-lint/lib/python3.12/site-packages
      - name: Accepted Phase 0 documentation and contracts
        run: |
          uv run python tools/check_docs.py
          uv run python tools/cost_model.py --check
          uv run python -m unittest discover -s tools -p 'test_*.py' -v
          uv run python tools/phase1_contracts.py --check
          uv run python tools/phase2_contracts.py --check
          uv run python tools/phase2_v2_contracts.py --check
          uv run python tools/phase2_corpus.py docs/ai/evaluation-corpus.manifest.json
          uv run python tools/phase2_preparation.py --catalog docs/ai/evaluation-candidates.json --manifest docs/ai/evaluation-corpus.manifest.json --output docs/ai/evaluation-readiness.json --check
      - run: uv run pip-audit --local
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.18.0', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Hash-anchored host tooling for unchanged recovery smoke
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          APT_SOURCE=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCE[@]}" update
          sudo apt-get "${APT_SOURCE[@]}" install --yes --only-upgrade ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
          python tools/security_bootstrap.py --repair-ensurepip
          uv sync --frozen
          python tools/security_trust.py --uv --seed
          uv run python tools/security_trust.py --certifi --seed
      - name: Generate ephemeral local credentials
        run: python tools/phase1_env.py
      - name: Fresh migration and real-service integration tests
        run: |
          docker compose build --pull --no-cache migrate tests
          docker image inspect repovox-tests --format '{{.Id}}'
          docker compose run --rm --no-deps --entrypoint dpkg-query tests -W ca-certificates
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/python tests tools/security_trust.py --uv --seed
          docker compose run --rm --no-deps tests python tools/security_trust.py --certifi --seed
          docker compose run --rm --no-deps tests pip-audit --cache-dir /tmp/repovox-audit --local
          docker compose run --rm --no-deps tests pip-audit --cache-dir /tmp/repovox-audit --path /usr/local/lib/python3.12/site-packages
          docker compose up -d postgres redis storage storage-init migrate
          docker compose run --rm --build tests
          CUSTODIAN_TEST_IMAGE=$(docker image inspect repovox-tests --format '{{.Id}}')
          docker run --rm --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --network none --memory 256m --cpus 1 --pids-limit 64 \
            -e PYTHONPATH=/workspace:/workspace/apps/api:/workspace/tests/unit \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m "$CUSTODIAN_TEST_IMAGE" \
            pytest -q tests/unit/test_custodian_lifecycle.py tests/unit/test_custodian_review.py tests/unit/test_custodian_source.py
          docker compose run --rm --no-deps --user 10002:10002 \
            -e PYTHONPATH=/workspace:/workspace/apps/api:/workspace/tests/unit tests \
            pytest -q tests/integration/test_execution_review.py
          docker compose run --rm --no-deps --user 0 --cap-add SETUID --cap-add SETGID --cap-add CHOWN tests python tools/phase2_storage_probe.py
          docker compose run --rm --no-deps --user 0 --cap-add SETUID --cap-add SETGID --cap-add CHOWN tests python tools/phase2_v2_storage_probe.py
      - name: Boot complete local stack
        run: |
          docker compose up -d --build --wait api web worker dispatcher
          uv run python tools/phase1_runtime.py
      - uses: actions/setup-node@v4
        with: {node-version: '24.18.0'}
      - name: Browser interaction test
        run: |
          npm --prefix apps/web ci
          cd apps/web
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Preserve synthetic desktop/mobile UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ui
          path: apps/web/test-results/ui/*.png
          retention-days: 7
          if-no-files-found: error
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Remove ephemeral services and volumes
        if: always()
        run: docker compose down --volumes
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - name: Scan Git history for credentials
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --exit-code 1
