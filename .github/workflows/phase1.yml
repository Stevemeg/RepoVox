name: Phase 1 and 2 quality gates
on:
  pull_request:
    branches: [main, phase0/foundation, phase1/saas-foundation, phase2/repository-intelligence, phase2/eval-entry, phase2/ai-audited-pilot, phase2/canonical-fact-remediation, phase2/source-fact-v2-evaluation, phase2/pilot-control-plane-safety, phase2/retention-runtime-verification, phase2/aws-retention-integration, experiment/offline-source-to-video, security/python-ca-bootstrap, security/node-next-remediation]
  push:
    branches: [main, phase1/saas-foundation, phase2/repository-intelligence, phase2/eval-entry, phase2/ai-audited-pilot, phase2/canonical-fact-remediation, phase2/source-fact-v2-evaluation, phase2/pilot-control-plane-safety, phase2/retention-runtime-verification, phase2/aws-retention-integration, feature/repository-to-video, feat/js-ts-frameworks-and-deploy-readiness, feat/problem-to-solution-story, feat/grounded-llm-narration, feat/neural-tts-and-frontend-handoff, fix/github-sha-and-ml-weights, feat/neural-voice-and-visual-architecture, feat/system-architecture-view]
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Refresh system trust from signed Ubuntu sources (USN-8944-1)
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          APT_SOURCE=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCE[@]}" update
          sudo apt-get "${APT_SOURCE[@]}" install --yes --only-upgrade ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
      - name: Install controlled tooling and locked dependencies
        run: |
          python tools/security_bootstrap.py --repair-ensurepip
          python tools/security_trust.py --uv --seed
          uv sync --frozen --link-mode copy
          uv run python tools/security_trust.py --certifi --seed
          uv run python tools/security_sdk_check.py
          uv run pip-audit --path "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
      - name: Verify locked runtime profile without development dependencies
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/repovox-runtime uv sync --frozen --link-mode copy --no-dev
          /tmp/repovox-runtime/bin/python tools/security_trust.py --certifi --seed
          /tmp/repovox-runtime/bin/python tools/security_sdk_check.py --synthetic-storage
          uv run pip-audit --path /tmp/repovox-runtime/lib/python3.12/site-packages
      - name: Security tooling checks
        run: |
          uv run ruff check tools/security_*.py
          uv run ruff format --check tools/security_*.py
          uv run mypy --strict tools/security_bootstrap.py tools/security_trust.py
          uv run mypy --strict --follow-imports silent --ignore-missing-imports tools/security_sdk_check.py tools/security_sdk_lint.py
      - run: uv run ruff check apps/api tests tools/phase1*.py tools/phase2*.py
      - run: uv run ruff format --check apps/api tests tools/phase1*.py tools/phase2*.py
      - run: uv run mypy
      - name: Additional AWS script body type checks (existing strict application gate unchanged)
        run: uv run mypy --explicit-package-bases --follow-imports silent --ignore-missing-imports --allow-untyped-defs --allow-untyped-calls --allow-any-generics --check-untyped-defs tools/phase2_aws*.py
      - run: uv run pytest tests/unit -q
      - name: Disabled AWS package drift, budget and CloudFormation validation (no credentials)
        run: |
          PYTHONPATH=. uv run python tools/phase2_aws_infrastructure.py --check
          PYTHONPATH=. uv run python tools/phase2_aws_budget.py
          python -m venv --without-pip /tmp/repovox-cfn-lint
          /tmp/repovox-cfn-lint/bin/python tools/security_bootstrap.py --pip-only
          /tmp/repovox-cfn-lint/bin/python -I -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r tools/requirements-cfn-lint.txt
          /tmp/repovox-cfn-lint/bin/python tools/security_trust.py --seed
          /tmp/repovox-cfn-lint/bin/python tools/security_sdk_check.py
          /tmp/repovox-cfn-lint/bin/python tools/security_sdk_lint.py --template infra/aws-retention/*.template.json
          uv run pip-audit --path /tmp/repovox-cfn-lint/lib/python3.12/site-packages
      - name: Accepted Phase 0 documentation and contracts
        run: |
          uv run python tools/check_docs.py
          uv run python tools/cost_model.py --check
          uv run python -m unittest discover -s tools -p 'test_*.py' -v
          uv run python tools/phase1_contracts.py --check
          uv run python tools/phase2_contracts.py --check
          uv run python tools/phase2_v2_contracts.py --check
          uv run python tools/phase2_corpus.py docs/ai/evaluation-corpus.manifest.json
          uv run python tools/phase2_preparation.py --catalog docs/ai/evaluation-candidates.json --manifest docs/ai/evaluation-corpus.manifest.json --output docs/ai/evaluation-readiness.json --check
      - run: uv run pip-audit --local
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.1', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Inspect actual Node binary and effective bundled trust
        run: |
          node ../../tools/security_node.mjs
          node --test ../../tools/security_node.test.mjs
          test "$(npm config get strict-ssl)" = true
          test "$(npm config get registry)" = https://registry.npmjs.org/
          test "$(npm config get ca)" = null
          test "$(npm config get cafile)" = null
      - run: npm ci
      - name: Confirm installed patched package tree
        run: |
          npm ls next sharp
          node -e 'console.log({node:process.version,next:require("next/package.json").version,sharp:require("sharp").versions.sharp,libvips:require("sharp").versions.vips}); if(require("next/package.json").version!=="16.4.6"||require("sharp").versions.sharp!=="0.35.5")process.exit(1)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Blocking: every runtime dependency that ships in the web image.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      # Reported, not blocking: once production passes above, anything left is a dev-only
      # tool (for example vitest -> picomatch) that may have no upstream fix yet.
      - name: Audit all dependencies (dev-only advisories reported)
        run: npm audit --audit-level=high || echo "::warning::Dev-only dependency advisory present (e.g. vitest/picomatch)"
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Hash-anchored host tooling for unchanged recovery smoke
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          APT_SOURCE=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCE[@]}" update
          sudo apt-get "${APT_SOURCE[@]}" install --yes --only-upgrade ca-certificates
          sudo update-ca-certificates --fresh
          dpkg-query -W ca-certificates
          python tools/security_bootstrap.py --repair-ensurepip
          uv sync --frozen --link-mode copy
          python tools/security_trust.py --uv --seed
          uv run python tools/security_trust.py --certifi --seed
          uv run python tools/security_sdk_check.py
      - name: Generate ephemeral local credentials
        run: python tools/phase1_env.py
      - name: Fresh migration and real-service integration tests
        shell: bash
        run: |
          docker compose build --pull --no-cache migrate tests
          docker image inspect repovox-tests --format '{{.Id}}'
          docker compose run --rm --no-deps --entrypoint dpkg-query tests -W ca-certificates
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/python tests tools/security_trust.py --uv --seed
          docker compose run --rm --no-deps tests python tools/security_trust.py --certifi --seed
          docker compose run --rm --no-deps tests python tools/security_sdk_check.py
          docker compose run --rm --no-deps tests pip-audit --cache-dir /tmp/repovox-audit --local
          docker compose run --rm --no-deps tests pip-audit --cache-dir /tmp/repovox-audit --path /usr/local/lib/python3.12/site-packages
          docker compose up -d postgres redis storage storage-init migrate media-migrate
          docker compose run --rm --build tests 2>&1 | tee integration-tests.log
          CUSTODIAN_TEST_IMAGE=$(docker image inspect repovox-tests --format '{{.Id}}')
          docker run --rm --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --network none --memory 256m --cpus 1 --pids-limit 64 \
            -e PYTHONPATH=/workspace:/workspace/apps/api:/workspace/tests/unit \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m "$CUSTODIAN_TEST_IMAGE" \
            pytest -q tests/unit/test_custodian_lifecycle.py tests/unit/test_custodian_review.py tests/unit/test_custodian_source.py
          docker compose run --rm --no-deps --user 10002:10002 \
            -e PYTHONPATH=/workspace:/workspace/apps/api:/workspace/tests/unit tests \
            pytest -q tests/integration/test_execution_review.py
          docker compose run --rm --no-deps --user 0 --cap-add SETUID --cap-add SETGID --cap-add CHOWN tests python tools/phase2_storage_probe.py
          docker compose run --rm --no-deps --user 0 --cap-add SETUID --cap-add SETGID --cap-add CHOWN tests python tools/phase2_v2_storage_probe.py
      - name: Boot complete local stack
        env:
          # Locally authored synthetic repositories for the browser-to-video test only.
          SYNTHETIC_SOURCE_DIR: /workspace/tests/fixtures/architectures
        run: |
          docker pull node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
          docker compose up -d --build --wait api web worker dispatcher media-worker
          uv run python tools/phase1_runtime.py
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.1'}
      - name: Inspect browser host and rebuilt web image trust
        run: |
          node tools/security_node.mjs
          docker image inspect repovox-web --format '{{.Id}} {{json .RepoDigests}}'
          docker image inspect node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53 --format '{{.Id}} {{json .RepoDigests}}'
          docker compose exec -T web node /security_node.mjs
          docker compose exec -T web node -e 'console.log({next:require("next/package.json").version,sharp:require("sharp").versions.sharp,libvips:require("sharp").versions.vips}); if(require("next/package.json").version!=="16.4.6"||require("sharp").versions.sharp!=="0.35.5")process.exit(1)'
      - name: Browser interaction test
        shell: bash
        run: |
          npm --prefix apps/web ci
          cd apps/web
          npx playwright install --with-deps chromium
          # The video test needs H.264/AAC decoders, which bundled Chromium does not have.
          google-chrome --version || npx playwright install chrome
          npm run test:e2e 2>&1 | tee e2e.log
      - name: Preserve synthetic desktop/mobile UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ui
          path: apps/web/test-results/ui/*.png
          retention-days: 7
          if-no-files-found: error
      - name: Preserve browser-to-video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-to-video
          path: |
            apps/web/test-results/video/
            apps/web/e2e.log
            integration-tests.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish browser-to-video evidence summary as annotations
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path("apps/web/test-results/video").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              job = data["job"]
              summary = {
                  "job": job["id"],
                  "repository": job["repository"],
                  "identifier": job["identifier"],
                  "architecture": job["architecture"],
                  "stages": [f"{s['stage_key']}:{s['state']}:{s['error_code']}" for s in job["stages"]],
                  "while_page_closed": data.get("progressed_while_page_closed"),
                  "videos": [
                      {k: v for k, v in video.items() if k != "playback"}
                      | {"playback": {k: video["playback"][k] for k in ("currentTime", "duration", "width", "height", "decodedFrames", "cues", "error")}}
                      if "playback" in video else video
                      for video in data["videos"]
                  ],
                  "denied": sorted({f"{a}/{b}" for a, b in data.get("denied", {}).values()}),
                  "denied_routes": len(data.get("denied", {})),
              }
              body = json.dumps(summary, separators=(",", ":")).replace("%", "%25")
              print(f"::notice title=browser-to-video {path.stem}::{body}")
          PY
      # The base docker-compose.yml above is unchanged. This recreates the same stack with the
      # hardened self-hosted overlay and checks what the overlay promises on live containers.
      - name: Hardened self-hosted overlay boots and passes its healthchecks
        shell: bash
        run: |
          bash -n scripts/deploy_selfhosted.sh
          bash scripts/deploy_selfhosted.sh --check
          overlay=(docker compose -f docker-compose.yml -f infrastructure/local/docker-compose.prod.yml)
          "${overlay[@]}" config --quiet
          "${overlay[@]}" up -d --no-build --wait --wait-timeout 300 \
            postgres redis storage api web worker dispatcher media-worker
          for service in postgres redis storage api web worker dispatcher media-worker; do
            id=$("${overlay[@]}" ps -q "$service")
            restart=$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$id")
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")
            echo "$service restart=$restart health=$health"
            test "$restart" = unless-stopped
          done
          for service in worker dispatcher media-worker web api; do
            test "$(docker inspect --format '{{.State.Health.Status}}' "$("${overlay[@]}" ps -q "$service")")" = healthy
          done
          web=$("${overlay[@]}" ps -q web)
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$web")" = true
          docker inspect --format '{{json .HostConfig.CapDrop}} {{json .HostConfig.SecurityOpt}}' "$web" | tee web-security.txt
          grep -q '"ALL"' web-security.txt && grep -q 'no-new-privileges:true' web-security.txt
          "${overlay[@]}" exec -T web sh -c 'touch /web/.next/cache/probe && ! touch /web/probe 2>/dev/null'
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS -o /dev/null -w 'web /sign-in %{http_code}\n' http://127.0.0.1:3000/sign-in
      # Production mode on the same stack: GitHub sign-in with placeholder OAuth credentials.
      # No request reaches GitHub; the checks stop at the redirect GitHub would receive.
      - name: Production mode boots with the GitHub identity adapter
        shell: bash
        run: |
          production=(docker compose -f docker-compose.yml -f infrastructure/local/docker-compose.prod.yml -f infrastructure/local/docker-compose.production.yml)
          bash scripts/deploy_selfhosted.sh --check --mode production
          printf 'REPOVOX_ORIGIN=https://repovox.invalid\nREPOVOX_GITHUB_CLIENT_ID=ci-placeholder\nREPOVOX_GITHUB_CLIENT_SECRET=%s\n' "$(openssl rand -hex 20)" >> .env
          bash scripts/deploy_selfhosted.sh --repair-env --mode production
          "${production[@]}" config --quiet
          "${production[@]}" up -d --no-build --wait --wait-timeout 300 api web worker dispatcher media-worker
          curl -fsS http://127.0.0.1:8000/ready | tee ready.json; echo
          grep -q '"environment":"production"' ready.json
          curl -fsS http://127.0.0.1:3000/api/v1/auth/config | tee auth-config.json; echo
          grep -q '"auth_provider":"github"' auth-config.json
          curl -fsS http://127.0.0.1:3000/sign-in | grep -q 'Continue with GitHub'
          login=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:3000/api/v1/auth/github/login)
          echo "login: ${login%%\?*}"
          case "$login" in
            "302 https://github.com/login/oauth/authorize?"*"redirect_uri=https%3A%2F%2Frepovox.invalid%2Fapi%2Fv1%2Fauth%2Fgithub%2Fcallback"*) ;;
            *) echo "unexpected login redirect"; exit 1 ;;
          esac
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'cookie: rv_oauth_state=browser' 'http://127.0.0.1:3000/api/v1/auth/github/callback?code=x&state=forged')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://repovox.invalid' -H 'content-type: application/json' -d '{"subject":"alex"}' http://127.0.0.1:3000/api/v1/auth/development/sign-in)" = 503
          accounts=("${production[@]}" run --rm --no-deps migrate python -m repovox.auth.accounts)
          "${accounts[@]}" add --github-id 4242 --name 'CI Account' --email ci@example.invalid
          "${accounts[@]}" list | grep -q '^4242'
          "${accounts[@]}" disable --github-id 4242
      - name: Summarise failures as annotations
        if: failure()
        run: |
          for log in integration-tests.log apps/web/e2e.log; do
            [ -f "$log" ] || continue
            grep -aE '^(FAILED|ERROR|E  ) |✘|Error:|expect\(|[0-9]+ (failed|passed)' "$log" | cut -c1-240 | head -n 45 > summary.txt || true
            [ -s summary.txt ] || tail -n 25 "$log" | cut -c1-240 > summary.txt
            body=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=$log::$body"
          done
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Preserve service logs
        if: always()
        run: docker compose logs --no-color --tail 400 migrate media-migrate api worker dispatcher media-worker > compose-logs.txt 2>&1 || true
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Remove ephemeral services and volumes
        if: always()
        run: docker compose down --volumes
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - name: Scan Git history for credentials
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --exit-code 1
