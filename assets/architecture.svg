<text x="1113.8" y="210" font-size="12" fill="#cbd5e1">re-parse and</text>
<text x="1113.8" y="226" font-size="12" fill="#cbd5e1">re-check claims</text>
<rect x="60.0" y="252" width="378.7" height="30" rx="9" fill="#0b1224" stroke="#22d3ee" stroke-opacity="0.8"/>
<text x="74.0" y="271.5" font-size="12.5" fill="#cbd5e1"><tspan font-weight="800" fill="#22d3ee">NETWORK</tspan>  api.github.com + codeload only · no redirects</text>
<rect x="450.7" y="252" width="769.3" height="30" rx="9" fill="#0b1224" stroke="#22d3ee" stroke-opacity="0.8"/>
<text x="464.7" y="271.5" font-size="12.5" fill="#cbd5e1"><tspan font-weight="800" fill="#22d3ee">SANDBOX</tspan>  child process · Landlock · seccomp (no sockets, exec, ptrace) · CPU / memory / file limits · scrubbed env</text>
<text x="60" y="308" font-size="12.5" fill="#94a3b8">Languages: Python, JavaScript, TypeScript, JSX, TSX  ·  Claim status: verified · inferred · documentation-only · unsupported  ·  Output: verified analysis artifact (contract 2.3)</text>
<path d="M640 334V374" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="656" y="359" font-size="12.5" fill="#cbd5e1">verified Stage 9 result + pinned archive · hash-checked handoff between two databases</text>
