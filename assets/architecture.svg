<text x="60" y="588" font-size="12.5" fill="#94a3b8">Optional narration model: self-hosted Ollama, an OpenAI-compatible endpoint or Anthropic. A scene that fails the grounding check keeps its template wording.</text>
<text x="60" y="608" font-size="12.5" fill="#94a3b8">Labels on screen: VERIFIED · INFERRED · AUTHOR-STATED · UNVERIFIED — each sentence shows the weakest status among the claims it cites.</text>
