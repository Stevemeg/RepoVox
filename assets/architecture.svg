<rect x="971.6" y="146" width="118.2" height="92" rx="10" fill="#0c1a2b" stroke="#22d3ee" stroke-opacity="0.55"/>
<circle cx="989.6" cy="168" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
