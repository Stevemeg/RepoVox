<text x="74.0" y="551.5" font-size="12.5" fill="#cbd5e1"><tspan font-weight="800" fill="#fbbf24">OPTIONAL LLM</tspan>  rewords only · every scene re-checked</text>
<rect x="450.7" y="532" width="769.3" height="30" rx="9" fill="#0b1224" stroke="#a78bfa" stroke-opacity="0.8"/>
