<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
<title id="t">RepoVox system architecture</title>
<desc id="d">Analysis worker stages 1 to 9 read one pinned commit as data inside a sandbox; media worker stages 10 to 15 turn the verified result into narrated videos; a Next.js app, FastAPI API, PostgreSQL, Redis and S3-compatible storage run the platform.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#170f38"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<style>
.s{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
</style></defs>
<rect width="1280" height="760" fill="url(#bg)"/>
<g class="s">
<text x="40" y="46" font-size="24" font-weight="800" fill="#f8fafc">From repository to narrated video</text>
<text x="40" y="72" font-size="14.5" fill="#a5b4fc">One pinned commit, read as data and never executed. Fifteen fenced stages. Every claim is re-verified before it is spoken.</text>
